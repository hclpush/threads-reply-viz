</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;
  --br:#242424;--br2:#333;
  --tx:#e2e2e2;--tx2:#aaa;
  --mu:#5a5a5a;--mu2:#3a3a3a;
  --ac:#ff6b6b;--ac2:rgba(255,107,107,.15);
  --fn:-apple-system,"SF Pro Display","PingFang TC","Noto Sans TC",sans-serif;
  --r:7px;--tr:140ms ease
}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}

/* Header */
.hd{padding:12px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg2)}
.hd h1{font-size:15px;font-weight:700;letter-spacing:-.02em;color:#fff}
.hd p{font-size:11px;color:var(--mu);margin-top:3px;line-height:1.5}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Toggle pill */
.tg{display:flex;background:var(--bg3);border:1px solid var(--br);border-radius:20px;padding:2px;gap:0}
.tg button{padding:4px 13px;font-size:11px;font-weight:600;cursor:pointer;color:var(--mu);border:none;background:transparent;font-family:var(--fn);border-radius:16px;transition:color var(--tr);white-space:nowrap}
.on-l{background:#fff!important;color:#000!important}
.on-v{background:var(--ac)!important;color:#fff!important}

/* Layout */
.main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 49px)}

/* Sidebar */
.sb{width:214px;flex-shrink:0;border-right:1px solid var(--br);overflow-y:auto;padding:14px 8px;background:var(--bg)}
.sb h3{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mu);text-transform:uppercase;margin-bottom:10px;padding:0 8px}
.ci{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);cursor:pointer;user-select:none;transition:background var(--tr)}
.ci:hover{background:var(--bg3)}
.ci.on{background:var(--bg3)}
.ci.on .cn{color:#fff;font-weight:600}
.ci.on .cc{color:var(--tx2)}
.cd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cn{font-size:12.5px;flex:1;line-height:1.4;color:var(--tx)}
.cc,.sc2{font-size:11px;color:var(--mu);flex-shrink:0;font-variant-numeric:tabular-nums}
.si{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 24px;border-radius:var(--r);cursor:pointer;user-select:none;transition:background var(--tr)}
.si:hover{background:var(--bg3)}
.si.on{background:var(--bg3)}
.sn{font-size:11px;color:var(--mu);flex:1;line-height:1.4}
.sn.on{color:var(--tx2)}
.dv{height:1px;background:var(--br);margin:10px 4px}

/* Main content */
.ct{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ca{padding:14px 20px 12px;border-bottom:1px solid var(--br);flex-shrink:0;background:var(--bg)}
.cw{height:175px;position:relative}
.ta{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sr{padding:10px 16px;border-bottom:1px solid var(--br);flex-shrink:0;background:var(--bg)}
.sr input{width:100%;background:var(--bg3);border:1px solid var(--br);border-radius:var(--r);padding:8px 13px;font-size:13px;color:var(--tx);font-family:var(--fn);outline:none;transition:border-color var(--tr),background var(--tr)}
.sr input:focus{border-color:var(--br2);background:var(--bg4)}
.sr input::placeholder{color:var(--mu)}
.ts{flex:1;overflow-y:auto}

/* Table */
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:8px 10px;text-align:left;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--br);white-space:nowrap}
tbody tr{border-bottom:1px solid #161616;transition:background var(--tr)}
tbody tr:hover{background:var(--bg3)}
.tl{padding:10px 10px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;width:56px;font-variant-numeric:tabular-nums}
.tc{padding:10px 7px;width:150px}
.bg{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.sbg{display:block;font-size:10px;color:var(--mu);margin-top:2px}
.ta2{padding:10px 7px;font-size:11px;color:var(--mu);white-space:nowrap;width:100px;overflow:hidden;text-overflow:ellipsis}
.tx{padding:10px 10px;font-size:12.5px;line-height:1.6;color:#b0b0b0;max-width:0}
.tx div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlk{padding:10px 10px;white-space:nowrap;width:64px}
.lb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--bg3);border:1px solid var(--br);font-size:12px;margin-right:2px;transition:background var(--tr),border-color var(--tr)}
.lb:hover{background:var(--bg4);border-color:var(--br2)}
.nr{text-align:center;padding:56px 20px;color:var(--mu);font-size:13px;line-height:1.6}
footer{padding:8px 20px;border-top:1px solid var(--br);font-size:10px;color:var(--mu2);text-align:center;flex-shrink:0}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#555}

@media(max-width:700px){.main{flex-direction:column;height:auto;overflow:auto}.sb{width:100%;border-right:none;border-bottom:1px solid var(--br)}.cw{height:130px}.tc,.ta2{display:none}}

/* ── Welcome Modal ── */
.wm-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.wm-card{background:#141414;border:1px solid #252525;border-radius:22px;padding:40px 44px 34px;max-width:450px;width:100%;text-align:center;box-shadow:0 32px 96px rgba(0,0,0,.85)}
.wm-pip{width:32px;height:3px;background:#222;border-radius:2px;margin:0 auto 28px}
.wm-tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-bottom:14px}
.wm-h1{font-size:22px;font-weight:900;letter-spacing:-.03em;color:#fff;line-height:1.25;margin-bottom:3px}
.wm-h1.dim{color:#666;margin-bottom:20px}
.wm-h2{font-size:13px;font-weight:400;color:#555;line-height:1.5;margin-bottom:22px}
.wm-div{height:1px;background:#1d1d1d;margin:0 0 22px}
.wm-lr{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
.wm-ll{font-size:12px;color:#3e3e3e}
.wm-tg{display:flex;background:#1a1a1a;border:1px solid #222;border-radius:20px;padding:2px}
.wm-lb{padding:5px 18px;font-size:12px;font-weight:600;cursor:pointer;color:#3e3e3e;border:none;background:transparent;border-radius:16px;transition:all 140ms ease;font-family:var(--fn)}
.wm-lb.on{background:#fff;color:#000}
.wm-cta{width:100%;padding:13px;background:var(--ac);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--fn);letter-spacing:.03em;transition:opacity 140ms;margin-bottom:16px}
.wm-cta:hover{opacity:.82}
.wm-ns{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#666;cursor:pointer;user-select:none}
.wm-ns input{accent-color:#666;cursor:pointer}

/* ── Category Popover ── */
.qi{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;font-size:9px;line-height:1;color:#2c2c2c;cursor:pointer;flex-shrink:0;border:none;background:transparent;transition:color 120ms;font-family:var(--fn);padding:0}
.qi:hover{color:#777}
.pop{position:fixed;z-index:500;background:#1e1e1e;border:1px solid #2d2d2d;border-radius:10px;padding:11px 14px;font-size:11.5px;line-height:1.6;color:#888;max-width:215px;box-shadow:0 10px 36px rgba(0,0,0,.75);pointer-events:none;opacity:0;transition:opacity 100ms ease;white-space:normal;display:none}
.pop.on{opacity:1;display:block}

    "認錯人": "誤以為認識某人，結果對著陌生人揮手、擁抱或打招呼。",
    "當眾出糗": "在眾人面前發生的尷尬瞬間，全場都是見證者。",
    "其他": "不屬於任何特定分類的其他窘境。",
    "回覆原 PO": "留言者對原始貼文的反應，不是具體的窘境故事。",
    "以為在跟自己說話": "誤以為有人在叫你，結果白白答應；或被叫到卻以為不是叫你。",
    "走錯空間": "走進錯誤的房間、廁所、店家或電梯。",
    "以為沒人亂講話": "以為沒人在場就亂說話，結果被抓個正著。",
    "叫錯": "叫錯對方的稱謂，最經典的是叫老師「媽媽」。"
  },
  "en": {
    "口誤": "You accidentally said the wrong word — usually while ordering food, at work, or mid-conversation when your brain short-circuited.",
    "被工作/兵役制約": "Your job or military service trained your brain so hard the habit leaked into everyday life. Note: Taiwan has mandatory military service for men — some jokes require that context.",
    "認錯人": "You waved at, hugged, or greeted a complete stranger thinking you recognized them.",
    "當眾出糗": "An embarrassing moment that happened in front of an audience — with witnesses.",
    "其他": "Everything else that doesn't fit neatly into the other categories.",
    "回覆原 PO": "Replies reacting to the original post — appreciation, jokes, or pure vibes. Not a specific cringe story.",
    "以為在跟自己說話": "You answered someone who wasn't talking to you, or ignored someone who was calling your name.",
    "走錯空間": "You walked into the wrong room, bathroom, store, or elevator.",
    "以為沒人亂講話": "You said something you shouldn't have, thinking no one was around — but someone was.",
    "叫錯": "You called someone by the wrong name. The classic: calling your teacher 'Mom'."
  }
};

var uOnly = false;

function tD(c){ return (CAT_DESC[lg] && CAT_DESC[lg][c]) || ""; }
function tUF(){ return lg==="zh" ? "國際通用笑點" : "Universal only"; }
function tAF(){ return lg==="zh" ? "全部笑點" : "All jokes"; }
function tCH(){ return lg==="zh" ? "↑ 點擊長條可篩選類別" : "↑ Click a bar to filter by category"; }
function zhBadge(){ return '<span class="zh-b" title="'+(lg==="zh"?"語言/文化限定，翻譯後效果可能打折":"Humour relies on Chinese language or local culture&#160;—&#160;may not translate")+'">'+(lg==="zh"?"文化梗":"ZH")+'</span>'; }

/* ── Welcome Modal ── */
var _wlg = "en";
function wML(l){
  _wlg = l;
  document.getElementById("wlb-en").className = "wm-lb"+(l==="en"?" on":"");
  document.getElementById("wlb-zh").className = "wm-lb"+(l==="zh"?" on":"");
}
function wClose(){
  if(document.getElementById("wm-ns").checked) localStorage.setItem("wm_s","1");
  localStorage.setItem("wm_l", _wlg);
  document.getElementById("wm").style.display="none";
  sL(_wlg);
}

/* ── Category Popover ── */
var _popSrc = null;
function showPop(e){
  e.stopPropagation();
  var btn = e.currentTarget, desc = btn.getAttribute("data-desc");
  var pop = document.getElementById("pop");
  if(_popSrc === desc){ hidePop(); return; }
  _popSrc = desc;
  pop.textContent = desc;
  pop.style.display = "block";
  var r = btn.getBoundingClientRect(), pw = 220;
  var left = r.right + 8, top = r.top;
  if(left + pw > window.innerWidth) left = r.left - pw - 8;
  if(top + 90 > window.innerHeight) top = window.innerHeight - 100;
  pop.style.left = left + "px"; pop.style.top = top + "px";
  requestAnimationFrame(function(){ pop.classList.add("on"); });
}
function hidePop(){ _popSrc=null; var p=document.getElementById("pop"); if(p){ p.classList.remove("on"); setTimeout(function(){ if(!p.classList.contains("on")) p.style.display="none"; }, 110); } }
document.addEventListener("click", hidePop);

/* ── Universal filter ── */
function sU(){
  uOnly = !uOnly;
  var b = document.getElementById("buo");
  if(b){ b.className = "uf-btn"+(uOnly?" on":""); b.textContent = uOnly ? tUF() : tAF(); }
  rT();
}

var lg="zh", vw="likes", af=null, AC=null;
var CC={};
D.catLabels.forEach(function(c,i){ CC[c]=D.catColors[i]; });
CC["其他"]="#787878";

function t(k){ return I[lg][k]; }
function tC(c){ return (I[lg].cat_labels[c]||c); }
function tS(s){ return (I[lg].sub_labels[s]||s); }

function esc(s){ return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }

function bS(){
  var el=document.getElementById("sl"), h="";
  h += '<div class="ci'+(af?"":" on")+'" data-cat="">'
    + '<div class="cd" style="background:#555"></div>'
    + '<span class="cn">'+t("all_categories")+'</span>'
    + '<span class="cc">'+D.total+'</span></div>'
    + '<div class="dv"></div>';
  D.catLabels.slice().sort(function(a,b){ return D.catStats[b].count-D.catStats[a].count; }).forEach(function(mc){
    var s=D.catStats[mc], ia=(af&&af.c===mc&&!af.s);
    var _desc=esc(tD(mc));
    h += '<div class="ci'+(ia?" on":"")+'" data-cat="'+esc(mc)+'">'
      + '<div class="cd" style="background:'+CC[mc]+'"></div>'
      + '<span class="cn">'+tC(mc)+'</span>'
      + (_desc?'<button class="qi" data-desc="'+_desc+'" onclick="showPop(event)">ⓘ</button>':'')
      + '<span class="cc">'+s.count+'</span></div>';
    Object.entries(s.subcategories||{})
      .sort(function(a,b){ return b[1].totalLikes-a[1].totalLikes; })
      .forEach(function(e){
        var sc=e[0], ss=e[1], ias=(af&&af.c===mc&&af.s===sc);
        h += '<div class="si'+(ias?" on":"")+'" data-cat="'+esc(mc)+'" data-sub="'+esc(sc)+'">'
          + '<span class="sn'+(ias?" on":"")+'">'+tS(sc)+'</span>'
          + '<span class="sc2">'+ss.count+'</span></div>';
      });
  });
  el.innerHTML=h;
}

// Event delegation — one listener handles all sidebar clicks
document.getElementById("sl").addEventListener("click", function(e){
  var el=e.target.closest("[data-cat]");
  if(!el) return;
  var cat=el.getAttribute("data-cat");
  var sub=el.getAttribute("data-sub");
  sF(cat||null, sub||undefined);
});

function bC(){
  var ctx=document.getElementById("ch").getContext("2d");
  if(AC) AC.destroy();
  // sort categories by current view on every render
  var sl=D.catLabels.slice().sort(function(a,b){
    return (vw==="likes"?D.catStats[b].totalLikes:D.catStats[b].count)
          -(vw==="likes"?D.catStats[a].totalLikes:D.catStats[a].count);
  });
  var lb=sl.map(tC), ds=[];
  sl.forEach(function(mc,mi){
    var s=D.catStats[mc], sbs=s.subcategories||{};
    var st=Object.values(sbs).reduce(function(t,ss){
      return t+(vw==="likes"?ss.totalLikes:ss.count);
    },0);
    var mv=(vw==="likes"?s.totalLikes:s.count)-st, bc=CC[mc];
    var a=new Array(sl.length).fill(0); a[mi]=mv;
    // single stack "s" so all bars fill full column width and align with labels
    ds.push({label:tC(mc),stack:"s",data:a,backgroundColor:bc+"cc",borderColor:"transparent",borderRadius:2});
    Object.entries(sbs)
      .sort(function(a,b){ return b[1].totalLikes-a[1].totalLikes; })
      .forEach(function(e,si){
        var sc=e[0], ss=e[1], v=(vw==="likes"?ss.totalLikes:ss.count);
        var a2=new Array(sl.length).fill(0); a2[mi]=v;
        var sa=["a0","88","72","5c","48"][si]||"48";
        ds.push({label:tS(sc),stack:"s",data:a2,backgroundColor:bc+sa,borderColor:"transparent",borderRadius:2});
      });
  });
  var totalAll=sl.reduce(function(sum,mc){return sum+(vw==="likes"?D.catStats[mc].totalLikes:D.catStats[mc].count);},0);
  var pctPlugin={id:"pct",afterDraw:function(chart){
    var ctx2=chart.ctx;
    var m0=chart.getDatasetMeta(0);
    sl.forEach(function(mc,xi){
      var tot=vw==="likes"?D.catStats[mc].totalLikes:D.catStats[mc].count;
      if(!tot||!m0.data[xi]) return;
      var xPos=m0.data[xi].x;
      var topY=chart.scales.y.getPixelForValue(tot);
      var pct=totalAll>0?Math.round(tot/totalAll*100)+"%":"";
      ctx2.save();ctx2.fillStyle="#999";ctx2.font="bold 9px sans-serif";
      ctx2.textAlign="center";ctx2.textBaseline="bottom";
      ctx2.fillText(pct,xPos,topY-2);ctx2.restore();
    });
  }};
  AC = new Chart(ctx,{
    type:"bar",
    data:{labels:lb, datasets:ds},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#1e1e1e",borderColor:"#333",borderWidth:1,
          titleColor:"#fff",bodyColor:"#ccc",padding:10,
          callbacks:{label:function(c){ if(!c.parsed.y) return null; return " "+c.dataset.label+": "+c.parsed.y.toLocaleString(); }}
        }
      },
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{color:"#666",font:{size:10},maxRotation:35}},
        y:{stacked:true,grid:{color:"#1a1a1a"},ticks:{color:"#555",font:{size:10},
          callback:function(v){ return v>=1000?(v/1000).toFixed(1)+"K":v; }
        }}
      },
      onClick:function(e,els){ if(els.length) sF(sl[els[0].index]); }
    },
    plugins:[pctPlugin]
  });
}

function rT(){
  var q=document.getElementById("si").value.toLowerCase().trim();
  var tb=document.getElementById("tb"), nr=document.getElementById("nr");
  var rows=D.replies;
  if(af) rows=rows.filter(function(r){ return r.c===af.c&&(!af.s||r.s===af.s); });
  if(q) rows=rows.filter(function(r){ return r.t.toLowerCase().indexOf(q)>=0||r.a.toLowerCase().indexOf(q)>=0; });
  if(uOnly) rows=rows.filter(function(r){ return r.i!==false; });
  rows=rows.slice().sort(function(a,b){ return b.l-a.l; });
  if(!rows.length){ tb.innerHTML=""; nr.style.display="block"; return; }
  nr.style.display="none";
  var f=document.createDocumentFragment();
  rows.forEach(function(r){
    var tr=document.createElement("tr");
    var cl=CC[r.c]||"#888";
    var gu="https://translate.google.com/?sl=zh-TW&tl=en&text="+encodeURIComponent(r.t);
    var sb=r.s ? ('<span class="sbg">'+tS(r.s)+(r.i===false?zhBadge():'')+"</span>") : "";
    var zh=(r.i===false && !r.s) ? zhBadge() : '';
    var sf=r.t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    var tt=r.t.replace(/"/g,"&quot;").replace(/\n/g," ");
    var linkHtml=(r.u ? '<a href="'+r.u+'" target="_blank" class="lb">&#128279;</a>' : "")
                +'<a href="'+gu+'" target="_blank" class="lb">&#127760;</a>';
    tr.innerHTML='<td class="tl">'+r.ls+'</td>'
      +'<td class="tc"><span class="bg" style="background:'+cl+'22;color:'+cl+'">'+tC(r.c)+'</span>'+sb+zh+'</td>'
      +'<td class="ta2">@'+r.a+'</td>'
      +'<td class="tx"><div title="'+tt+'">'+sf+'</div></td>'
      +'<td class="tlk">'+linkHtml+'</td>';
    f.appendChild(tr);
  });
  tb.innerHTML=""; tb.appendChild(f);
}

function sF(cat,sub){
  if(cat==null){ af=null; }
  else if(sub!=null && sub!==undefined){ af={c:cat,s:sub}; }
  else{ af=(af&&af.c===cat&&!af.s) ? null : {c:cat}; }
  bS(); rT();
}

function aI(){
  document.getElementById("ht").textContent=t("title");
  document.getElementById("hs").textContent=t("subtitle");
  document.getElementById("si").placeholder=t("search_placeholder");
  document.getElementById("blk").textContent=t("toggle_likes");
  document.getElementById("bct").textContent=t("toggle_count");
  document.getElementById("c1").textContent=t("col_likes");
  document.getElementById("c2").textContent=t("col_category");
  document.getElementById("c3").textContent=t("col_author");
  document.getElementById("c4").textContent=t("col_text");
  document.getElementById("c5").textContent=t("col_link");
  document.getElementById("fs").textContent=t("source");
  document.getElementById("nr").textContent=t("no_results");
  document.getElementById("sb_title").textContent=t("sidebar_title");
  var bu=document.getElementById("buo"); if(bu){ bu.textContent=uOnly?tUF():tAF(); bu.className="uf-btn"+(uOnly?" on":""); }
  var ch=document.getElementById("ch-hint"); if(ch) ch.textContent=tCH();
}

function sL(l){
  lg=l;
  document.getElementById("bzh").className=(l==="zh"?"on-l":"");
  document.getElementById("ben").className=(l==="en"?"on-l":"");
  aI(); bS(); bC(); rT();
}

function sV(v){
  vw=v;
  document.getElementById("blk").className=(v==="likes"?"on-v":"");
  document.getElementById("bct").className=(v==="count"?"on-v":"");
  aI(); bC();
}

(function(){
  var sl = localStorage.getItem("wm_l") || "en";
  _wlg = sl; wML(sl);
  if(localStorage.getItem("wm_s")==="1") document.getElementById("wm").style.display="none";
  sL(sl); bC(); rT();
  function pulse(){ var h=document.getElementById("ch-hint"); if(h){ h.classList.add("glow"); setTimeout(function(){ h.classList.remove("glow"); },700); } }
  setTimeout(pulse, 1800);
  setInterval(pulse, 6000);
})();
</script>
