<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d0d;--bg3:#1e1e1e;--br:#2a2a2a;--tx:#e0e0e0;--mu:#666;--mu2:#444;--ac:#ff6b6b;--fn:-apple-system,"SF Pro Display","PingFang TC","Noto Sans TC",sans-serif}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.hd{padding:14px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hd h1{font-size:18px;font-weight:800;letter-spacing:-.02em;color:#fff}
.hd p{font-size:11px;color:var(--mu);margin-top:2px}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tg{display:flex;background:var(--bg3);border:1px solid var(--br);border-radius:20px;overflow:hidden}
.tg button{padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;color:var(--mu);border:none;background:transparent;font-family:var(--fn)}
.on-l{background:#fff!important;color:#000!important;border-radius:20px;margin:2px}
.on-v{background:var(--ac)!important;color:#fff!important;border-radius:20px;margin:2px}
.main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 53px)}
.sb{width:210px;flex-shrink:0;border-right:1px solid var(--br);overflow-y:auto;padding:12px 10px}
.sb h3{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin-bottom:8px;padding:0 4px}
.ci{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;user-select:none}
.ci:hover,.ci.on,.si:hover,.si.on{background:var(--bg3)}
.cd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cn{font-size:12px;flex:1;line-height:1.3;color:var(--tx)}
.cc,.sc2{font-size:10px;color:var(--mu);flex-shrink:0}
.si{display:flex;align-items:center;gap:7px;padding:3px 7px 3px 22px;border-radius:6px;cursor:pointer;user-select:none}
.sn{font-size:11px;color:var(--mu);flex:1}
.sn.on{color:var(--tx)}
.dv{height:1px;background:var(--br);margin:8px 0}
.ct{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ca{padding:14px 20px 10px;border-bottom:1px solid var(--br);flex-shrink:0}
.cw{height:175px;position:relative}
.ta{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sr{padding:10px 16px;border-bottom:1px solid var(--br);flex-shrink:0}
.sr input{width:100%;background:var(--bg3);border:1px solid var(--br);border-radius:7px;padding:7px 12px;font-size:13px;color:var(--tx);font-family:var(--fn);outline:none}
.sr input:focus{border-color:#555}
.sr input::placeholder{color:var(--mu2)}
.ts{flex:1;overflow-y:auto}
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:7px 10px;text-align:left;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--br);white-space:nowrap}
tbody tr{border-bottom:1px solid #181818}
tbody tr:hover{background:var(--bg3)}
.tl{padding:9px 10px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;width:56px}
.tc{padding:9px 7px;width:150px}
.bg{display:inline-block;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbg{display:block;font-size:10px;color:var(--mu);margin-top:2px}
.ta2{padding:9px 7px;font-size:11px;color:var(--mu);white-space:nowrap;width:100px;overflow:hidden;text-overflow:ellipsis}
.tx{padding:9px 10px;font-size:12px;line-height:1.5;color:#bbb;max-width:0}
.tx div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlk{padding:9px 10px;white-space:nowrap;width:64px}
.lb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;background:var(--bg3);border:1px solid var(--br);font-size:12px;margin-right:2px}
.lb:hover{background:var(--br)}
.nr{text-align:center;padding:50px 20px;color:var(--mu);font-size:13px}
footer{padding:8px 20px;border-top:1px solid var(--br);font-size:10px;color:var(--mu2);text-align:center;flex-shrink:0}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--br);border-radius:2px}
@media(max-width:700px){.main{flex-direction:column;height:auto;overflow:auto}.sb{width:100%;border-right:none;border-bottom:1px solid var(--br)}.cw{height:130px}.tc,.ta2{display:none}}
</style>
</head>
<body>
<div class="hd">
  <div><h1 id="ht"></h1><p id="hs"></p></div>
  <div class="hr">
    <div class="tg">
      <button id="bzh" onclick="sL('zh')">&#20013;</button>
      <button id="ben" onclick="sL('en')">EN</button>
    </div>
    <div class="tg">
      <button id="blk" onclick="sV('likes')"></button>
      <button id="bct" onclick="sV('count')"></button>
    </div>
  </div>
</div>
<div class="main">
  <div class="sb"><h3>&#39006;&#21029;</h3><div id="sl"></div></div>
  <div class="ct">
    <div class="ca"><div class="cw"><canvas id="ch"></canvas></div></div>
    <div class="ta">
      <div class="sr"><input id="si" type="text" placeholder="..." oninput="rT()"></div>
      <div class="ts">
        <table>
          <thead><tr>
            <th id="c1"></th><th id="c2"></th>
            <th id="c3"></th><th id="c4"></th><th id="c5"></th>
          </tr></thead>
          <tbody id="tb"></tbody>
        </table>
        <div id="nr" class="nr" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

var lg="zh", vw="likes", af=null, AC=null;
var CC={};
D.catLabels.forEach(function(c,i){ CC[c]=D.catColors[i]; });

function t(k){ return I[lg][k]; }

function tS(s){ return (I[lg].sub_labels[s]||s); }

function esc(s){ return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }

function bS(){
  var el=document.getElementById("sl"), h="";
  h += '<div class="ci'+(af?"":" on")+'" data-cat="">'
    + '<div class="cd" style="background:#555"></div>'
    + '<span class="cn">'+t("all_categories")+'</span>'
    + '<span class="cc">'+D.total+'</span></div>'
    + '<div class="dv"></div>';
  D.catLabels.forEach(function(mc){
    var s=D.catStats[mc], ia=(af&&af.c===mc&&!af.s);
    h += '<div class="ci'+(ia?" on":"")+'" data-cat="'+esc(mc)+'">'
      + '<div class="cd" style="background:'+CC[mc]+'"></div>'
      + '<span class="cn">'+tC(mc)+'</span>'
      + '<span class="cc">'+s.count+'</span></div>';
    Object.entries(s.subcategories||{})
      .sort(function(a,b){ return b[1].totalLikes-a[1].totalLikes; })
      .forEach(function(e){
        var sc=e[0], ss=e[1], ias=(af&&af.c===mc&&af.s===sc);
        h += '<div class="si'+(ias?" on":"")+'" data-cat="'+esc(mc)+'" data-sub="'+esc(sc)+'">'
          + '<span class="sn'+(ias?" on":"")+'">'+tS(sc)+'</span>'
          + '<span class="sc2">'+ss.count+'</span></div>';
      });
  });
  el.innerHTML=h;
}

// Event delegation — one listener handles all sidebar clicks
document.getElementById("sl").addEventListener("click", function(e){
  var el=e.target.closest("[data-cat]");
  if(!el) return;
  var cat=el.getAttribute("data-cat");
  var sub=el.getAttribute("data-sub");
  sF(cat||null, sub||undefined);
});

function bC(){
  var ctx=document.getElementById("ch").getContext("2d");
  if(AC) AC.destroy();
  var lb=D.catLabels.map(tC), ds=[];
  D.catLabels.forEach(function(mc,mi){
    var s=D.catStats[mc], sbs=s.subcategories||{};
    var st=Object.values(sbs).reduce(function(t,ss){
      return t+(vw==="likes"?ss.totalLikes:ss.count);
    },0);
    var mv=(vw==="likes"?s.totalLikes:s.count)-st, bc=CC[mc];
    var a=new Array(D.catLabels.length).fill(0); a[mi]=mv;
    ds.push({label:tC(mc),stack:mc,data:a,backgroundColor:bc+"cc",borderColor:"transparent",borderRadius:2});
    Object.entries(sbs)
      .sort(function(a,b){ return b[1].totalLikes-a[1].totalLikes; })
      .forEach(function(e){
        var sc=e[0], ss=e[1], v=(vw==="likes"?ss.totalLikes:ss.count);
        var a2=new Array(D.catLabels.length).fill(0); a2[mi]=v;
        ds.push({label:tS(sc),stack:mc,data:a2,backgroundColor:bc+"66",borderColor:"transparent",borderRadius:2});
      });
  });
  AC = new Chart(ctx,{
    type:"bar",
    data:{labels:lb, datasets:ds},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:"#1e1e1e",borderColor:"#333",borderWidth:1,
          titleColor:"#fff",bodyColor:"#ccc",padding:10,
          callbacks:{label:function(c){ return " "+c.dataset.label+": "+c.parsed.y.toLocaleString(); }}
        }
      },
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{color:"#666",font:{size:10},maxRotation:35}},
        y:{stacked:true,grid:{color:"#1a1a1a"},ticks:{color:"#555",font:{size:10},
          callback:function(v){ return v>=1000?(v/1000).toFixed(1)+"K":v; }
        }}
      },
      onClick:function(e,els){ if(els.length) sF(D.catLabels[els[0].index]); }
    }
  });
}

function rT(){
  var q=document.getElementById("si").value.toLowerCase().trim();
  var tb=document.getElementById("tb"), nr=document.getElementById("nr");
  var rows=D.replies;
  if(af) rows=rows.filter(function(r){ return r.c===af.c&&(!af.s||r.s===af.s); });
  if(q) rows=rows.filter(function(r){ return r.t.toLowerCase().indexOf(q)>=0||r.a.toLowerCase().indexOf(q)>=0; });
  rows=rows.slice().sort(function(a,b){ return b.l-a.l; });
  if(!rows.length){ tb.innerHTML=""; nr.style.display="block"; return; }
  nr.style.display="none";
  var f=document.createDocumentFragment();
  rows.forEach(function(r){
    var tr=document.createElement("tr");
    var cl=CC[r.c]||"#888";
    var gu="https://translate.google.com/?sl=zh-TW&tl=en&text="+encodeURIComponent(r.t);
    var sb=r.s ? ('<span class="sbg">'+tS(r.s)+"</span>") : "";
    var sf=r.t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    var tt=r.t.replace(/"/g,"&quot;").replace(/\n/g," ");
    var linkHtml=(r.u ? '<a href="'+r.u+'" target="_blank" class="lb">&#128279;</a>' : "")
                +'<a href="'+gu+'" target="_blank" class="lb">&#127760;</a>';
    tr.innerHTML='<td class="tl">'+r.ls+'</td>'
      +'<td class="tc"><span class="bg" style="background:'+cl+'22;color:'+cl+'">'+tC(r.c)+'</span>'+sb+'</td>'

      +'<td class="tx"><div title="'+tt+'">'+sf+'</div></td>'
      +'<td class="tlk">'+linkHtml+'</td>';
    f.appendChild(tr);
  });
  tb.innerHTML=""; tb.appendChild(f);
}

function sF(cat,sub){
  if(cat==null){ af=null; }
  else if(sub!=null && sub!==undefined){ af={c:cat,s:sub}; }
  else{ af=(af&&af.c===cat&&!af.s) ? null : {c:cat}; }

}
