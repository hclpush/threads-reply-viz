name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dashboard
        run: python3 pipeline/build.py

      - name: Sanity check
        run: |
          python3 - <<'EOF'
          import json, sys

          # index.html was generated and is large enough
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          assert len(html) > 100_000, f"index.html too small: {len(html)} bytes"

          # bilingual strings present (JS is minified — check data strings, not var names)
          for token in ["口誤", "Slip of the Tongue", "betabreakhsin", "chart.js"]:
              assert token in html, f"Missing expected token: {token}"

          # data files are valid JSON with expected reply count
          with open("data/replies.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          reply_count = len(data["replies"])
          assert reply_count >= 1155, f"Reply count dropped: {reply_count}"

          print(f"✓ index.html: {len(html):,} bytes")
          print(f"✓ replies: {reply_count:,}")
          EOF

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: rebuild dashboard [skip ci]"
          git push
